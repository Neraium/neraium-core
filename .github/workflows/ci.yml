name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Verify dependency shim
        run: |
          python - <<'PY'
          from pathlib import Path

          requirements = Path("requirements.txt")
          lines = [
              line.strip()
              for line in requirements.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if lines != ["."]:
              raise SystemExit(
                  "requirements.txt must remain a thin shim with only '.' as "
                  "the non-comment requirement."
              )
          print("requirements.txt shim check passed")
          PY

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
