[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-core"
version = "0.1.0"
description = "Read-only structural instability instrumentation engine and API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "starlette>=0.36",
  "uvicorn>=0.29",
  "scipy>=1.11",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
]
plots = [
  "matplotlib",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["neraium_core*"]
exclude = ["apps*", "tests*", "scripts*", "sii*"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "E501", "E731", "E741", "F401", "F541", "F601", "F811", "F821", "F841"]
