[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "neraium-core"
version = "0.1.0"
description = "Read-only structural instability instrumentation engine and API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "starlette>=0.36",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]
plots = ["matplotlib"]
