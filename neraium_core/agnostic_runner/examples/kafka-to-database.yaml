# Agnostic Runner: Kafka to Database Example
#
# Consume structural intelligence results from Kafka and persist to database
# Enables long-term analysis and historical querying

data_source:
  type: kafka
  config:
    # Kafka broker addresses
    brokers:
      - localhost:9092
      - localhost:9093

    # Topic to consume from
    topic: sensor-data

    # Consumer group (for offset tracking)
    group_id: neraium-runner

    # Where to start reading (earliest, latest, or none)
    auto_offset_reset: earliest

    # Maximum records to read (null = unlimited)
    max_records: null

    # Timeout for poll operations (milliseconds)
    timeout_ms: 10000

output_sink:
  type: database
  config:
    # SQLAlchemy connection string
    # SQLite: sqlite:///neraium_results.db
    # PostgreSQL: postgresql://user:password@localhost:5432/neraium
    # MySQL: mysql+pymysql://user:password@localhost:3306/neraium
    connection_string: sqlite:///neraium_results.db

    # Table name for results
    table_name: neraium_results

    # Batch insert size (improves performance)
    batch_size: 100

    # Store sensor/output data as JSON (vs flattened columns)
    json_columns: true

engine:
  # Full research mode for comprehensive analysis
  mode: research_assistive

  enable_trajectory_memory: true
  enable_law_extraction: true
  enable_law_engine: true
  enable_intervention_memory: true
  enable_reliability_calibration: true
  enable_cross_system_transfer: true
  enable_advisory_layers: true
  enable_experimental_layers: false
