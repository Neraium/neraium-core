# Agnostic Runner: CSV to JSON Example
#
# Process sensor data from a CSV file and output results as JSON
# This is the simplest use case for the agnostic runner

data_source:
  type: csv
  config:
    # Path to input CSV file
    path: data.csv

    # Column containing timestamps (must be numeric)
    timestamp_col: timestamp

    # Column containing unit/equipment identifiers
    unit_id_col: unit_id

    # Prefix for sensor columns (e.g., sensor_temperature, sensor_pressure)
    sensor_prefix: sensor_

    # Optional: Skip first N rows (useful for metadata)
    skip_rows: 0

output_sink:
  type: json
  config:
    # Output path for results (single JSON array)
    path: results.json

engine:
  # Production mode: optimized for deployment
  # Other presets: "research", "experimental", "minimal"
  mode: production

  enable_trajectory_memory: true
  enable_law_extraction: false
  enable_law_engine: false
  enable_intervention_memory: true
  enable_reliability_calibration: true
  enable_cross_system_transfer: false
  enable_advisory_layers: true
  enable_experimental_layers: false
