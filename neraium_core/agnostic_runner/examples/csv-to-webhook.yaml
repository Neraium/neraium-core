# Agnostic Runner: CSV to Webhook Example
#
# Process batch data from CSV and send results to HTTP webhook endpoints
# Useful for triggering downstream actions (alerts, integrations, dashboards)

data_source:
  type: csv
  config:
    path: historical_data.csv
    timestamp_col: ts
    unit_id_col: equipment_id
    sensor_prefix: s_

output_sink:
  type: webhook
  config:
    # Webhook endpoint URL
    url: https://your-api.example.com/webhooks/neraium-results

    # Request timeout
    timeout_sec: 10

    # Verify SSL certificates
    verify_ssl: true

    # Custom HTTP headers (e.g., authentication)
    headers:
      Authorization: "Bearer your-webhook-token"
      X-Custom-Header: "neraium-runner"

    # Number of results to batch in one webhook call
    # 1 = send immediately for each result
    # 10 = accumulate 10 results, send together
    batch_size: 5

    # Retry configuration for failed webhook calls
    retry_count: 3
    retry_delay_ms: 1000

engine:
  # Minimal mode for minimal latency
  mode: production

  enable_trajectory_memory: false
  enable_law_extraction: false
  enable_law_engine: false
  enable_intervention_memory: false
  enable_reliability_calibration: false
  enable_cross_system_transfer: false
  enable_advisory_layers: true
  enable_experimental_layers: false
