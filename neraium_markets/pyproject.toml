[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-markets"
version = "0.1.0"
description = "Read-only Neraium Markets pipeline (local advisory; not execution)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10"]

[tool.setuptools]
packages = ["neraium"]
py-modules = ["config"]
