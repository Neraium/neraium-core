version: 1.0
runtime: python311

build:
  commands:
    build:
      - echo "Build phase complete."

run:
  runtime-version: 3.11
  # For App Runner Python 3.11, install dependencies in pre-run so packages are available at runtime.
  pre-run:
    - pip3 install .
  # Use module invocation so startup does not depend on uvicorn script PATH resolution.
  command: python3 -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
  network:
    port: 8000
    env: PORT
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: NERAIUM_LOG_LEVEL
      value: INFO
    - name: NERAIUM_RUNTIME_MODE
      value: production
    # Default request and parser caps used by apps/api/main.py
    - name: NERAIUM_MAX_REQUEST_BODY_BYTES
      value: "52428800"
    - name: NERAIUM_UVICORN_H11_MAX_INCOMPLETE_EVENT_SIZE
      value: "67108864"
