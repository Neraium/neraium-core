version: 1.0
runtime: python311

build:
  commands:
    build:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

run:
  runtime-version: 3.11
  # Canonical runtime entrypoint for live service verification.
  command: python -m uvicorn neraium_core.markets.app.api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
