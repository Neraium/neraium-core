version: 1.0
runtime: python311

build:
  commands:
    build:
      # Install all dependencies from repository root for source-directory '/'
      - pip3 install -r requirements.txt

run:
  runtime-version: 3.11
  pre-run:
    # Reinstall in run image to ensure runtime has all modules available
    - pip3 install -r requirements.txt
  command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
  network:
    port: 8000
    env: PORT
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: NERAIUM_LOG_LEVEL
      value: INFO
    # Default request and parser caps used by apps/api/main.py
    - name: NERAIUM_MAX_REQUEST_BODY_BYTES
      value: "52428800"
    - name: NERAIUM_UVICORN_H11_MAX_INCOMPLETE_EVENT_SIZE
      value: "67108864"
