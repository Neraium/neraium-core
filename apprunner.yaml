version: 1.0
runtime: python311

build:
  commands:
    build:
      - python3 -m pip install --upgrade pip
      - pip3 install -r requirements.txt

run:
  runtime-version: 3.11
  pre-run:
    - python3 -m pip install --upgrade pip
    - pip3 install -r requirements.txt
  command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
  network:
    port: 8000
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
