<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neraium Markets Operator Console</title>
  <style>
    :root {
      --bg:#090d14; --panel:#101826; --panel-2:#0c1320; --text:#e5e7eb; --muted:#9ca3af;
      --line:#223146; --accent:#60a5fa; --good:#34d399; --warn:#f59e0b; --bad:#f87171;
      --pill:#16263a;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,Arial,sans-serif}
    .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
    .sidebar{border-right:1px solid var(--line);padding:16px;background:#0b111b;position:sticky;top:0;height:100vh}
    .brand{font-size:18px;font-weight:700;margin-bottom:16px}.brand small{display:block;color:var(--muted);font-weight:500}
    .nav button{display:block;width:100%;text-align:left;margin:2px 0;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
    .nav button.active{background:var(--panel);border-color:var(--line)}
    .main{display:flex;flex-direction:column}
    .header{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#0b111b;position:sticky;top:0;z-index:2}
    .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.v{font-weight:600}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:12px}
    .page{display:none;padding:16px}.page.active{display:block}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
    h2{margin:0 0 8px;font-size:15px} h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase}
    .status-strip{display:flex;gap:8px;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{position:sticky;top:0;background:var(--panel-2);font-size:12px;color:var(--muted)}
    tbody tr{cursor:pointer} tbody tr:hover{background:#162132}
    .action-act{color:var(--good)} .action-wait{color:var(--warn)} .action-reduce{color:#fbbf24} .action-avoid{color:var(--bad)}
    .bar{height:7px;background:#1b2738;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%}
    .controls{display:flex;gap:8px;flex-wrap:wrap}.controls button,.controls input,.controls select{background:#0b111b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
    .mono{font-family:ui-monospace,SFMono-Regular,monospace}.muted{color:var(--muted)}
    details{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel-2)}
    .empty{padding:20px;border:1px dashed var(--line);color:var(--muted);border-radius:8px;text-align:center}
    .banner{padding:10px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;background:#152235}
    @media (max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.g2,.g3{grid-template-columns:1fr}.header{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Neraium Markets<small>Operator Console</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="header">
      <div><div class="k">Session</div><div class="v" id="hdrSession">--</div></div>
      <div><div class="k">Provider</div><div class="v" id="hdrProvider">--</div></div>
      <div><div class="k">Last Event</div><div class="v mono" id="hdrLastEvent">--</div></div>
      <div><div class="k">Last Signal</div><div class="v mono" id="hdrLastSignal">--</div></div>
      <div><div class="k">User</div><div class="v">ops@neraium</div></div>
    </header>

    <section id="page-command" class="page active"></section>
    <section id="page-live" class="page"></section>
    <section id="page-replay" class="page"></section>
    <section id="page-signals" class="page"></section>
    <section id="page-integrations" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
</div>

<script>
const PAGES=[['command','Command Center'],['live','Live Session'],['replay','Replay / Historical'],['signals','Signals / History'],['integrations','Integrations / Data'],['settings','Settings']];
const nav=document.getElementById('nav');
let appState={latest_signals:[],recent_logs:[]}, selectedSignal=null;
PAGES.forEach(([id,label],i)=>{const b=document.createElement('button');b.textContent=label;b.className=i===0?'active':'';b.onclick=()=>showPage(id,b);nav.appendChild(b)});
function showPage(id,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');render();}
function pill(text,type=''){return `<span class="pill ${type}">${text}</span>`}
function pctBar(value,good=true){const v=Math.round((Number(value)||0)*100);return `<div class="bar"><span style="width:${v}%;background:${good?'#34d399':'#f87171'}"></span></div><div class="mono muted">${v}%</div>`}
function actionClass(a){return 'action-'+String(a||'').toLowerCase()}
function stateMessage(){const s=appState.session||{};if(s.connection_state==='disconnected')return 'Disconnected: no market data connection.';if(s.session_state==='warming_up')return 'Warming Up: building enough history before valid outputs.';if((appState.data_age_seconds||0)>45)return 'Connected but no incoming data in the last 45s.';if(!appState.latest_signals?.length)return 'Connected and receiving data but no valid signals yet.';const suppressed=appState.latest_signals.filter(x=>x.suppression_status!=='none').length; if(suppressed) return `Live but ${suppressed} outputs suppressed by cooldown/duplication governance.`;return 'Live and generating governed outputs.'}
async function control(action){const symbols=(document.getElementById('symbolsInput')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);const timeframe=document.getElementById('timeframeInput')?.value;await fetch('/api/session/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,timeframe,symbols})});await refresh();}
function signalTable(rows){if(!rows.length)return '<div class="empty">No signals available yet.</div>';return `<div style="max-height:420px;overflow:auto"><table><thead><tr><th>Time</th><th>Ticker</th><th>Permission</th><th>Best Action</th><th>Confidence</th><th>Fragility</th><th>Size Guidance</th><th>Reason</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.signal_id}"><td class="mono">${r.timestamp||'--'}</td><td>${r.ticker}</td><td>${pill(r.action_permission)}</td><td class="${actionClass(r.best_action)}"><b>${r.best_action}</b></td><td>${pctBar(r.confidence,true)}</td><td>${pctBar(r.fragility,false)}</td><td>${r.size_guidance}</td><td>${r.one_line_reason||''}</td></tr>`).join('')}</tbody></table></div>`}
function renderCommand(){const s=appState.session||{};return `<div class="banner">${stateMessage()}</div><div class="grid g2"><div class="card"><h2>Latest Signals</h2>${signalTable(appState.latest_signals||[])}</div><div class="grid"><div class="card"><h2>Session Status</h2><div class="status-strip">${pill(s.connection_state||'Disconnected')}${pill((s.session_state||'Stopped').replace('_',' '))}${pill('Warmup '+Math.round((s.warmup_progress||0)*100)+'%')}${pill('TF '+(s.timeframe||'--'))}${pill((s.watched_symbols||[]).join(', '))}</div></div><div class="card"><h2>Quick Controls</h2><div class="controls"><button onclick="control('start')">Start Session</button><button onclick="control('stop')">Stop Session</button><input id="symbolsInput" placeholder="Symbols: SPY,QQQ" /><select id="timeframeInput"><option>1m</option><option>5m</option><option>15m</option><option>1h</option></select><button onclick="control('update')">Apply</button></div></div><div class="card"><h2>Current Session Summary</h2><div>Events: <b>${appState.event_count||0}</b></div><div>System State: <b>${(appState.system_state?.state||'unknown').toUpperCase()}</b></div><div>Confidence: <b>${Math.round((appState.system_state?.confidence||0)*100)}%</b></div></div><div class="card"><h2>Recent Changes / Warnings</h2><div class="mono muted">${(appState.recent_logs||[]).slice(-8).reverse().join('<br>')}</div></div></div></div>`}
function renderLive(){const rows=(appState.latest_signals||[]).slice(0,20);const suppressed=rows.filter(r=>r.suppression_status!=='none').length;return `<div class="grid g2"><div class="card"><h2>Live Governed Outputs</h2>${signalTable(rows)}</div><div class="grid"><div class="card"><h2>Live Status</h2><div>${stateMessage()}</div><div class="muted">Suppressed/abstained: ${suppressed}</div></div><div class="card"><h2>Watched Symbols</h2>${(appState.session?.watched_symbols||[]).map(x=>pill(x)).join(' ')||'<div class="empty">No symbols configured</div>'}</div><div class="card"><h2>Buffer/Bar Health</h2><div>Data age: <b>${appState.data_age_seconds||0}s</b></div><div>Warmup progress: <b>${Math.round((appState.session?.warmup_progress||0)*100)}%</b></div></div><div class="card"><h2>Recent Events / Errors / Reconnect Notices</h2><div class="mono muted">${(appState.recent_logs||[]).slice(-12).reverse().join('<br>')}</div></div></div></div>`}
function renderReplay(){const rows=(appState.latest_signals||[]).slice(0,40);return `<div class="grid g2"><div class="card"><h2>Replay Controls</h2><div class="controls"><select><option>Cached Dataset: session-memory</option></select><input placeholder="Symbols" value="${(appState.session?.watched_symbols||[]).join(',')}"/><select><option>${appState.session?.timeframe||'15m'}</option></select><input type="date"/><input type="date"/><button disabled>Run Replay</button><button onclick="exportCsv()">Export CSV</button></div><p class="muted">Replay workflow uses the same signal language as live. Current environment exposes cached session history only.</p><h3>Latest Replay Metadata</h3><div>Rows available: ${rows.length}</div><div>Last run state: idle</div></div><div class="card"><h2>Replay Results</h2>${signalTable(rows)}</div></div>`}
function renderSignals(){const rows=appState.latest_signals||[];const filters=`<div class="controls"><input id="fltTicker" placeholder="Ticker"/><select id="fltPerm"><option value="">Any permission</option><option>ACT</option><option>WAIT</option></select><select id="fltAction"><option value="">Any action</option><option>ACT</option><option>WAIT</option><option>REDUCE</option><option>AVOID</option></select><button onclick="applyFilters()">Apply Filters</button><button onclick="exportCsv()">Export CSV</button></div>`;return `<div class="card"><h2>Signal History</h2>${filters}<div id="signalsTable">${signalTable(rows)}</div></div><div class="card" style="margin-top:12px"><h2>Signal Detail</h2>${renderSignalDetail(selectedSignal||rows[0])}</div>`}
function renderSignalDetail(s){if(!s)return '<div class="empty">Select a signal row to inspect rationale and invalidation.</div>';return `<div class="grid g2"><div><h3>Summary</h3><div>${pill(s.timestamp||'--')} ${pill(s.ticker||'--')} ${pill(s.action_permission||'--')} <span class="${actionClass(s.best_action)}"><b>${s.best_action||'--'}</b></span></div><p>${s.one_line_reason||'--'}</p><h3>Invalidation</h3><ul>${(s.invalidation_conditions||[]).map(x=>`<li>${x}</li>`).join('')}</ul><h3>Market / Governance Diagnostics</h3><div>Market state: ${s.market_state||'--'}</div><div>Transition: ${s.transition_state||'--'}</div><div>Structural drift: ${s.structural_drift_score??'--'}</div><div>Latest instability: ${s.latest_instability??'--'}</div><div>Cooldown/suppression: ${s.cooldown_status||'none'} / ${s.suppression_status||'none'}</div><div>Allowed actions: ${(s.allowed_actions||[]).join(', ')||'--'}</div><div>Blocked actions: ${(s.blocked_actions||[]).join(', ')||'--'}</div></div><div><h3>Validity + Positioning</h3><div>Confidence ${pctBar(s.confidence,true)}</div><div>Fragility ${pctBar(s.fragility,false)}</div><div>Validity Score: <b>${Math.round((s.validity_score||0)*100)}%</b></div><div>Size Guidance: <b>${s.size_guidance||'--'}</b></div><details><summary>Advanced diagnostics</summary><pre class="mono" style="overflow:auto">${JSON.stringify(s.diagnostics||s,null,2)}</pre></details></div></div>`}
function renderIntegrations(){return `<div class="grid g2"><div class="card"><h2>Data Health</h2><div>Provider: <b>${appState.session?.provider||'--'}</b></div><div>Connection: <b>${appState.session?.connection_state||'disconnected'}</b></div><div>Last ingestion age: <b>${appState.data_age_seconds||0}s</b></div><div>Connectivity checks: ${(appState.data_age_seconds||0)<45?'passing':'stale'}</div><div>Latest ingestion errors:</div><div class="mono muted">${(appState.recent_logs||[]).filter(x=>x.includes('warn')||x.includes('error')).slice(-8).join('<br>')||'none'}</div></div><div class="card"><h2>Signal Health</h2><div>Total signals: ${appState.latest_signals?.length||0}</div><div>Suppressed outputs: ${(appState.latest_signals||[]).filter(x=>x.suppression_status!=='none').length}</div><div>Abstaining because setup invalid: ${(appState.latest_signals||[]).filter(x=>x.action_permission==='WAIT').length}</div><h3>Capabilities</h3><div class="muted">Entitlements are environment-derived. Historical cached datasets are available from local event store only.</div></div></div>`}
function renderSettings(){return `<div class="card"><h2>Settings</h2><div class="muted">Settings surface retained for app compatibility. Operator-configurable session controls live in Command Center.</div></div>`}
function render(){document.getElementById('page-command').innerHTML=renderCommand();document.getElementById('page-live').innerHTML=renderLive();document.getElementById('page-replay').innerHTML=renderReplay();document.getElementById('page-signals').innerHTML=renderSignals();document.getElementById('page-integrations').innerHTML=renderIntegrations();document.getElementById('page-settings').innerHTML=renderSettings();document.querySelectorAll('tbody tr[data-id]').forEach(r=>r.onclick=()=>{selectedSignal=(appState.latest_signals||[]).find(x=>x.signal_id===r.dataset.id);document.querySelector('.nav button:nth-child(4)').click();});
 document.getElementById('hdrSession').textContent=(appState.session?.session_state||'stopped').replace('_',' '); document.getElementById('hdrProvider').textContent=appState.session?.provider||'--'; document.getElementById('hdrLastEvent').textContent=appState.session?.last_event_time||'--'; document.getElementById('hdrLastSignal').textContent=appState.session?.last_signal_time||'--';}
function applyFilters(){const t=(document.getElementById('fltTicker').value||'').toUpperCase();const p=document.getElementById('fltPerm').value;const a=document.getElementById('fltAction').value;const rows=(appState.latest_signals||[]).filter(r=>(!t||r.ticker.includes(t))&&(!p||r.action_permission===p)&&(!a||r.best_action===a));document.getElementById('signalsTable').innerHTML=signalTable(rows);document.querySelectorAll('#signalsTable tbody tr[data-id]').forEach(r=>r.onclick=()=>{selectedSignal=(appState.latest_signals||[]).find(x=>x.signal_id===r.dataset.id);document.querySelector('#page-signals .card:last-child').innerHTML='<h2>Signal Detail</h2>'+renderSignalDetail(selectedSignal);});}
function exportCsv(){const rows=appState.latest_signals||[];const cols=['timestamp','ticker','action_permission','best_action','confidence','fragility','size_guidance','one_line_reason'];const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>JSON.stringify(r[c]??'')).join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='neraium_signals.csv';a.click();URL.revokeObjectURL(a.href)}
async function refresh(){try{const r=await fetch('/api/dashboard');appState=await r.json();}catch(e){appState={latest_signals:[],recent_logs:['error: cannot reach backend'],session:{session_state:'error',connection_state:'disconnected'}};}render()}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
